[package]
name = "pchan-imgui"
version = "0.1.0"
edition = "2024"

[dependencies]
miette = { version = "7.6.0" }
pchan-audio.workspace = true
pchan-bind.workspace = true
pchan-emu.workspace = true
pchan-gpu.workspace = true
pchan-utils = { workspace = true, features = ["tracing-subscriber"] }
pchan-executor.workspace = true 
rfd = "0.17.2"
spin_sleep = "1.3.3"

imgui = "0.12.0"
imgui-wgpu = { version = "*", git = "https://github.com/wyvernbw/imgui-wgpu-rs", branch = "wyvernbw/bump-wgpu-30" }
wgpu = "30.0.0"
winit = "0.30.13"
imgui-winit-support = "0.13.0"
tracing.workspace = true
