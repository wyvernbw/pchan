[package]
name = "pchan-dbg-gpui"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = { package = "gpui-ce", version = "0.2.2" }
gpui_platform = { package = "gpui_ce_platform", version = "0.1.0", features = ["font-kit"] }
gpui-component = { package = "gpui_ce_components", version = "0.2.0" }
pchan-emu.workspace = true
pchan-gpu.workspace = true
miette = "7.6.0"
kanal.workspace = true
pchan-utils = { workspace = true, features = ["tracing-subscriber"] }
pchan-audio.workspace = true
pchan-bind.workspace = true
image = { version = "0.25.10", default-features = false }
spin_sleep = "1.3.3"
