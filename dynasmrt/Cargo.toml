[package]
name = "dynasmrt"
edition = "2024"

description = "A simple runtime for assembling code at runtime. Combined with the plugin crate dynasm it can be used to write JIT compilers easily."

[lints]
workspace = true

[dependencies]
memmap2 = "0.9.9"
byteorder = "1.5.0"
fnv = "1.0.7"
dynasm = { workspace = true }
libc = "0.2.191"
mmap-rs = "0.7.0"
