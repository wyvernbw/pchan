[package]
name = "dynasmrt"
edition = "2024"

description = "A simple runtime for assembling code at runtime. Combined with the plugin crate dynasm it can be used to write JIT compilers easily."

[dependencies]
memmap2 = "0.9.9"
byteorder = "1.5.0"
fnv = "1.0.7"
dynasm = { version = "=5.1.0", workspace = true }
