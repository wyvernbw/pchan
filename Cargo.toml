cargo-features = ["profile-rustflags"]

[package]
name = "pchan"
version = "0.1.0"
edition = "2024"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
cargo = "deny"

[workspace]
resolver = "3"
members = [
    "pchan-emu",
    "pchan-macros",
    "pchan-utils",
    "pchan-gpu",
    "pchan-bind",
    "pchan-audio",
    "pchan-dbg-egui",
    "pchan-dbg-v2",
    "pchan-egui-experimental",
    "pchan-input",
    "pchan-executor"
]

[workspace.dependencies]
arbitrary-int = "2.1.1"
bitbybit = "2.0.0"
tracing = "0.1.44"
const-hex = { version = "1.19.0", features = ["nightly", "portable-simd"] }
pchan-emu = { path = "./pchan-emu" }
pchan-gpu = { path = "./pchan-gpu" }
pchan-macros = { path = "./pchan-macros" }
pchan-utils = { path = "./pchan-utils", default-features = false }
pchan-bind = { path = "./pchan-bind" }
pchan-audio = { path = "./pchan-audio" }
pchan-input = { path = "./pchan-input" }
pchan-executor = { path = "./pchan-executor" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
kanal = "0.1.1"

[workspace.dependencies.smol]
git = "https://github.com/wyvernbw/smol.git"
version = "2.0.2"
branch = "wyvernbw-feature-gates" 

[profile.dev.package."*"]
opt-level = "s"

[profile.dev]
opt-level = "s"
panic = "unwind"

[profile.release]
codegen-units = 1
lto = "fat"
panic = "unwind"
strip = "debuginfo"

[profile.bench]
debug = 2

[profile.san]
inherits = "dev"
opt-level = 1
debug = true
overflow-checks = true
panic = "abort"
rustflags = ["-Zsanitizer=address"]
